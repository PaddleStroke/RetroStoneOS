# SD card images (docs/ci.md).
#   - a version tag v* builds every release board and publishes a GitHub
#     Release: the images (.img.xz), SHA256SUMS, the legal-info archives
#     (GPL source offer) and notes from .github/release-notes.md;
#     Only tag builds get the update signing key (the "release" environment)
#     and they refuse to make an unsigned update package;
#   - "Run workflow" (workflow_dispatch) builds any set of boards and keeps
#     the files as workflow artifacts, without a release and unsigned.
# The boards come from buildroot-external/configs/*_defconfig
# (scripts/ci/list-boards.sh: "# ci: skip" and development variants are
# left out of "release").
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      boards:
        description: '"release" (the release set), "all" (every defconfig), or names, e.g. "retrostone2 rpi4_64"'
        type: string
        default: release
      legal_info:
        description: Also make the legal-info (source offer) archives
        type: boolean
        default: false
      image_tests:
        description: Run the image tests (data partition, A/B boot) after the build
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel an image build: a second run for the same ref waits.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  boards:
    name: board list
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.boards || 'release' }}
        run: |
          m=$(sh scripts/ci/list-boards.sh "$SELECTION")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -m json.tool

  build:
    name: ${{ matrix.board }}
    needs: boards
    # Repository variables (docs/ci.md, "Build times"): IMAGES_RUNNER, a
    # larger or self-hosted runner for every board; IMAGES_RUNNER_HEAVY, one
    # for the heavy boards only (board-info.sh HEAVY: the Orange Pi 5).
    runs-on: ${{ matrix.heavy && vars.IMAGES_RUNNER_HEAVY || vars.IMAGES_RUNNER || 'ubuntu-24.04' }}
    # A heavy board may not finish in time on a standard runner: its failure
    # does not stop the release, which then goes out without it.
    continue-on-error: ${{ matrix.heavy }}
    # Tags only: the "release" environment holds the UPDATE_SIGNING_KEY
    # secret and only admits v* tags (docs/ci.md, section 7). Manual runs
    # use no environment, get no key and make unsigned packages.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    # GitHub-hosted jobs stop at 6 h: 300 min for the build step (its own
    # limit, so that the ccache and the logs are still saved when it hits
    # it), about 40-50 min for the rest (set-up, packaging, legal-info,
    # tests, uploads; each with its own limit).
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.boards.outputs.matrix) }}
    env:
      BOARD: ${{ matrix.board }}
      HAVE_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN != '' }}
      HAVE_VC_GAMES_TOKEN: ${{ secrets.VC_GAMES_TOKEN != '' }}
      # only used by a defconfig that selects the UART password login
      RSOS_UART_PASSWORD: ${{ secrets.UART_PASSWORD }}
      # LLVM and Clang (host and target) need more room than a plain board
      CCACHE_MAXSIZE: ${{ matrix.heavy && '4G' || '2500M' }}
      LEGAL_INFO: ${{ github.ref_type == 'tag' || inputs.legal_info == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and cache directories
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            # the version the image reports (and the updater compares)
            echo "RSOS_CI_OS_VERSION=$v" >> "$GITHUB_ENV"
          else
            v=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')-${GITHUB_SHA::8}
          fi
          {
            echo "RSOS_CI_VERSION=$v"
            echo "RSOS_CI_WORK=$HOME/rsos-ci" # free-disk.sh may move it to /mnt
            echo "BR2_DL_DIR=$HOME/.rsos-cache/dl"
            echo "BR2_CCACHE_DIR=$HOME/.rsos-cache/ccache"
          } >> "$GITHUB_ENV"
          echo "version $v"

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        timeout-minutes: 15
        run: sh scripts/ci/free-disk.sh

      - name: Install the Buildroot host dependencies
        timeout-minutes: 15
        run: sh scripts/ci/install-deps.sh buildroot tests

      # The caches share GitHub's 10 GB per repository (docs/ci.md, "Caches"):
      # one download cache, saved by the RetroStone2 build (the other boards
      # start from it and fetch the rest), and a board's ccache only when it
      # helps a re-run (the build failed or hit its limit), or always for a
      # heavy board.
      - name: Restore the download cache
        id: dl-cache
        timeout-minutes: 15
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rsos-cache/dl
          key: br-dl-${{ hashFiles('buildroot-external/configs/**', 'buildroot-external/package/**/*.mk', 'buildroot-external/package/**/*.hash', 'buildroot-external/board/*/patches/**/*.hash', 'scripts/ci/buildroot.env') }}
          restore-keys: |
            br-dl-

      - name: Restore the ccache
        timeout-minutes: 15
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rsos-cache/ccache
          key: br-ccache-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            br-ccache-${{ matrix.board }}-

      # The owner-approved homebrew games live in a private repository
      # (docs/ci.md, "Homebrew games"). Without the secret the images are built
      # without them (BR2_PACKAGE_RSOS_HOMEBREW=n).
      - name: Fetch the homebrew games (private repository)
        if: env.HAVE_HOMEBREW_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PaddleStroke/RetroStoneOS-homebrew
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: .homebrew-src
          persist-credentials: false

      - name: Stage the homebrew games
        run: |
          if [ "$HAVE_HOMEBREW_TOKEN" = true ]; then
            sh scripts/ci/stage-homebrew.sh .homebrew-src
            rm -rf .homebrew-src
            echo "RSOS_CI_HOMEBREW=yes" >> "$GITHUB_ENV"
          else
            echo "::notice::HOMEBREW_TOKEN is not set: $BOARD is built without the homebrew games"
            echo "RSOS_CI_HOMEBREW=no" >> "$GITHUB_ENV"
          fi

      # The RetroStone VC games (Bomber Mole, Leady Squid: all rights reserved,
      # 8BCraft) live in the private PaddleStroke/RetroStoneVC (docs/ci.md,
      # "RetroStone VC games"). Without the secret the images are built
      # without them (BR2_PACKAGE_RSOS_VC_GAMES=n: no RetroStone system).
      - name: Fetch the RetroStone VC games (private repository)
        if: env.HAVE_VC_GAMES_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PaddleStroke/RetroStoneVC
          token: ${{ secrets.VC_GAMES_TOKEN }}
          path: .vc-games-src
          persist-credentials: false

      - name: RetroStone VC games
        run: |
          if [ "$HAVE_VC_GAMES_TOKEN" = true ]; then
            echo "RetroStone VC $(git -C .vc-games-src rev-parse --short=12 HEAD)"
            echo "RSOS_CI_VC_GAMES=yes" >> "$GITHUB_ENV"
            echo "RSOS_CI_VC_GAMES_DIR=$GITHUB_WORKSPACE/.vc-games-src" >> "$GITHUB_ENV"
          else
            echo "::notice::VC_GAMES_TOKEN is not set: $BOARD is built without the RetroStone VC games (no RetroStone system)"
            echo "RSOS_CI_VC_GAMES=no" >> "$GITHUB_ENV"
          fi

      - name: Configure (make ${{ matrix.board }}_defconfig)
        id: configure
        run: sh scripts/ci/build-board.sh "$BOARD" configure

      - name: Download the sources
        id: source
        timeout-minutes: 45
        run: sh scripts/ci/build-board.sh "$BOARD" source

      - name: Save the download cache
        if: steps.dl-cache.outputs.cache-hit != 'true' && steps.source.outcome == 'success' && startsWith(matrix.board, 'retrostone2')
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rsos-cache/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Build
        id: build
        timeout-minutes: 300
        run: sh scripts/ci/build-board.sh "$BOARD" build

      - name: Save the ccache
        if: always() && steps.configure.outcome == 'success' && (matrix.heavy || steps.build.outcome != 'success')
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rsos-cache/ccache
          key: br-ccache-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The changelog excerpt of the update package: the commit subjects
      # since the previous tag (only the commits, no trees or files).
      - name: Fetch the history for the changelog
        if: github.ref_type == 'tag'
        timeout-minutes: 10
        continue-on-error: true
        run: git fetch --quiet --filter=tree:0 --unshallow --tags origin

      # The image and, for boards with A/B slots, the system update package
      # (.rsu, docs/updates.md). On a tag it is signed with UPDATE_SIGNING_KEY
      # (the "release" environment's secret) and the step fails without it:
      # a release never carries an unsigned package. Manual runs are never
      # signed: *-unsigned.rsu, which release images refuse.
      - name: Compress the image, make the update package
        timeout-minutes: 30
        env:
          UPDATE_SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.UPDATE_SIGNING_KEY || '' }}
          RSOS_RSU_REQUIRE_SIGNED: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: sh scripts/ci/build-board.sh "$BOARD" package

      - name: Upload the image
        timeout-minutes: 15
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.board }}
          path: |
            ${{ env.RSOS_CI_WORK }}/artifacts/*.img.xz
            ${{ env.RSOS_CI_WORK }}/artifacts/*.img.xz.sha256
            ${{ env.RSOS_CI_WORK }}/artifacts/*.rsu
            ${{ env.RSOS_CI_WORK }}/artifacts/*.rsu.sha256
            ${{ env.RSOS_CI_WORK }}/artifacts/*.info
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.ref_type == 'tag' && 7 || 30 }}

      - name: legal-info (source offer)
        if: env.LEGAL_INFO == 'true'
        timeout-minutes: 40
        run: sh scripts/ci/build-board.sh "$BOARD" legal-info

      - name: Upload the legal-info archive
        if: env.LEGAL_INFO == 'true'
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legal-${{ matrix.board }}
          path: ${{ env.RSOS_CI_WORK }}/artifacts/legal-info-*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.ref_type == 'tag' && 7 || 30 }}

      # After the files the release needs, so that a slow test cannot cost
      # them the job's time.
      - name: Image tests
        if: github.event_name != 'workflow_dispatch' || inputs.image_tests
        timeout-minutes: 20
        # Not a gate yet: they need loop devices, exFAT and QEMU on the
        # runner (docs/ci.md). Their result shows in the log and the summary.
        continue-on-error: true
        run: sh scripts/ci/run-tests.sh image "$BOARD" "$RSOS_CI_WORK/output-$BOARD"

      - name: Summary
        if: always()
        env:
          BOARD_NAME: ${{ matrix.name }}
          BOARD_STATUS: ${{ matrix.status }}
        run: |
          {
            echo "### $BOARD ($BOARD_NAME, $BOARD_STATUS)"
            echo "homebrew games: ${RSOS_CI_HOMEBREW:-?}"
            echo "RetroStone VC games: ${RSOS_CI_VC_GAMES:-?}"
            echo '```'
            ls -l "$RSOS_CI_WORK/artifacts" 2>/dev/null || echo "no artifacts"
            cat "$RSOS_CI_WORK"/artifacts/*.sha256 2>/dev/null || true
            df -h "$RSOS_CI_WORK" | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.board }}
          path: |
            ${{ env.RSOS_CI_WORK }}/output-${{ matrix.board }}/*.log
            ${{ env.RSOS_CI_WORK }}/output-${{ matrix.board }}/.config
            ${{ env.RSOS_CI_WORK }}/output-${{ matrix.board }}/build/build-time.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: GitHub Release
    # "build" succeeds when every board did, except the heavy ones
    # (continue-on-error): the release then goes out without them.
    needs: [boards, build]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the previous tag
          persist-credentials: false

      # The legal-info archives of all the boards are about 15 GB: the files
      # go to the work directory free-disk.sh picks (RSOS_CI_WORK), not to
      # the checkout on /.
      - name: Free disk space
        run: sh scripts/ci/free-disk.sh

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ env.RSOS_CI_WORK }}/dist

      - name: Download the legal-info archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: legal-*
          merge-multiple: true
          path: ${{ env.RSOS_CI_WORK }}/dist

      - name: Boards missing from the release
        env:
          MATRIX: ${{ needs.boards.outputs.matrix }}
        run: |
          for img in $(printf '%s' "$MATRIX" | python3 -c 'import json, sys; print(" ".join(b["image"] for b in json.load(sys.stdin)["include"]))'); do
            if ! ls "$RSOS_CI_WORK"/dist/retrostoneos-*-"$img".info > /dev/null 2>&1; then
              echo "::warning::$img did not build (a heavy board, docs/ci.md): it is not in this release"
            fi
          done
          df -h "$RSOS_CI_WORK" | tail -n 1

      - name: Source of the bundled GPL homebrew game
        # µCity is GPL-3.0+: its source goes next to the images that ship it
        # (docs/homebrew.md).
        run: |
          D=$RSOS_CI_WORK/dist
          if grep -qs "^HOMEBREW='y'" "$D"/*.info; then
            wget -q -O "$D/ucity-1.2-source.tar.gz" https://github.com/AntonioND/ucity/archive/refs/tags/v1.2.tar.gz
            echo "9ffdd325294ebbd8a4adcc5a5bb40a2ea4b981cb8e4889a5392ef4796cdb2dc1  $D/ucity-1.2-source.tar.gz" | sha256sum -c -
          fi

      - name: Release notes and SHA256SUMS
        run: |
          D=$RSOS_CI_WORK/dist
          U=$RSOS_CI_WORK/upload
          # the build jobs refuse to make one on a tag; never publish one
          if ls "$D"/*-unsigned.rsu > /dev/null 2>&1; then
            echo "::error::unsigned update packages in a release: $(cd "$D" && ls ./*-unsigned.rsu)"
            exit 1
          fi
          sh scripts/ci/release-notes.sh "$TAG" "$D" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          mkdir -p "$U"
          for f in "$D"/*.img.xz "$D"/*.rsu "$D"/legal-info-* "$D"/*-source.tar.gz; do
            [ -f "$f" ] || continue
            case $f in *.sha256) continue ;; esac
            mv "$f" "$U"/
          done
          (cd "$U" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          ls -l "$U"
          echo "UPLOAD_DIR=$U" >> "$GITHUB_ENV"

      - name: Publish the release
        run: |
          pre=
          case $TAG in *-rc* | *-beta* | *-alpha*) pre=--prerelease ;; esac
          # Upload everything to a draft, then publish: with immutable
          # releases, a published release can no longer get assets.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != true ]; then
              echo "::error::release $TAG is already published; delete it or use a new tag"
              exit 1
            fi
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" ${pre:+"$pre"}
          else
            gh release create "$TAG" --draft --verify-tag --title "RetroStoneOS ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" ${pre:+"$pre"}
          fi
          gh release upload "$TAG" --clobber "$UPLOAD_DIR"/*
          if [ -n "$pre" ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url -q .url
