# RetroStoneOS board profile: Orange Pi H3 boards (PC, PC Plus, One, Lite),
# community-tested port (docs/boards.md). HDMI only, USB pads, no battery.
# The same file for the orangepi_pc and orangepi_one images.
#
# Read by the frontend (frontend/src/board.h) and the init scripts
# (/usr/libexec/rsos/board.sh). Missing keys mean auto-detection; the
# values below mostly say "there is none" explicitly.

# (one file for both images: the release notes name them "Orange Pi PC / PC
# Plus" and "Orange Pi One / Lite", scripts/ci/board-info.sh NAMES)
name = Orange Pi PC / One

# --- Frontend
# No built-in controls: USB (or Bluetooth) pads and keyboards
builtin_pad_prefix =
builtin_stick =
# No built-in screen: the TV on HDMI-A-1 (sun8i DesignWare HDMI). With
# nothing plugged in, the HDMI port is lit anyway (720p) and the menu shows
# up when a TV is connected.
internal_display = none
internal_refresh_options =
backlight = none
battery_supply = none
ac_supply = none
usb_supply = none
thermal_zone = auto
# The power button of the PC / PC Plus is wired to the SoC's power pin (no
# input device); any input device that reports KEY_POWER (a USB keyboard)
# works.
power_key_device = auto
pek_startup_ms = 0
# HDMI: the "allwinner-hdmi" card (I2S2 -> HDMI, patches/linux/0001).
# Analog: the "H3 Audio Codec" card, on the 3.5 mm jack of the PC / PC Plus
# (the One and Lite have none); unused while the display is HDMI (the
# frontend's sound follows the display).
audio_internal = auto
audio_hdmi = auto
audio_hdmi_pcm = plughw
cpu_governor_menu = schedutil
cpu_governor_game = performance
storage_overlays =
display_quirks =

# --- Init scripts (/usr/libexec/rsos/board.sh)
# The SD card (mmc0: /dev/mmcblk0, patches/linux/0001 adds the aliases).
# The data partition is MBR entry 1 (physically last), as on the RetroStone2.
data_disk = /dev/mmcblk0
data_partition = 1
boot_reason = none
# rsos-net: the EMAC (dwmac-sun8i, internal PHY) is built into the kernel.
# No supported on-board WiFi (the PC Plus / Lite RTL8189FTV needs an
# out-of-tree driver) and no on-board Bluetooth: Bluetooth works with a USB
# dongle (btusb).
wifi_module = none
wifi_sdio_host =
eth_modules =
bt_module = btusb

# --- Build (board/common/post-build.sh)
# Root shell on the debug UART (UART0, the 3-pin header next to the HDMI
# connector, 115200 8N1)
serial_console = ttyS0
