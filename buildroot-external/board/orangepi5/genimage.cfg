# RetroStoneOS SD card image for the Orange Pi 5 (A/B root filesystems),
# the RetroStone2 layout moved after the Rockchip boot loader.
#
# Disk order                                   MBR entry
#   0       MBR
#   32 KiB  u-boot-rockchip.bin                 -   (idbloader: DDR init + SPL, read
#                                                    by the boot ROM at sector 64;
#                                                    u-boot.itb at 8 MiB inside it)
#   14 MiB  U-Boot environment, 2 x 64 KiB      -   (A/B boot state)
#   16 MiB  rootfs A, ext4, 1 GiB               2   (read-only, /boot inside; 1 GiB:
#                                                    Mesa panfrost brings LLVM)
#   1040 MiB rootfs B, ext4, 1 GiB              3   (empty until the first update)
#   2064 MiB data, FAT32 seed "RETROSTONE", 128 MiB  1  (turned into a
#                                                    full-size exFAT by the first boot)
#
# The environment area is left zeroed (invalid CRC): U-Boot uses its default
# environment and boot.scr saves it once with the rsos_* variables. The data
# partition is the first MBR entry so that PCs show it.

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition data {
		partition-type = 0x0c
		image = "data.vfat"
		offset = 2064M
	}

	partition rootfs-a {
		partition-type = 0x83
		bootable = true
		image = "rootfs.ext4"
		offset = 16M
		size = 1024M
	}

	partition rootfs-b {
		partition-type = 0x83
		offset = 1040M
		size = 1024M
	}
}
