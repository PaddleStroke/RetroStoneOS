# RetroStoneOS board profile: Orange Pi 5 (Rockchip RK3588S),
# community-tested port (docs/boards.md). HDMI only, USB pads, no battery.
#
# Read by the frontend (frontend/src/board.h) and the init scripts
# (/usr/libexec/rsos/board.sh). Missing keys mean auto-detection; the
# values below mostly say "there is none" explicitly.

name = Orange Pi 5

# --- Frontend
# No built-in controls: USB (or Bluetooth) pads and keyboards
builtin_pad_prefix =
builtin_stick =
# No built-in screen: the TV on HDMI-A-1 (HDMI0: VOP2 + DesignWare HDMI
# QP). With nothing plugged in, the HDMI port is lit anyway (720p) and the
# menu shows up when a TV is connected.
internal_display = none
internal_refresh_options =
backlight = none
battery_supply = none
ac_supply = none
usb_supply = none
# The SoC thermal zones are "soc-thermal", "bigcore0-thermal", ...: auto
# takes the first whose type contains "cpu", else the first one.
thermal_zone = auto
# No power button on the board; any input device that reports KEY_POWER (a
# USB keyboard) works.
power_key_device = auto
pek_startup_ms = 0
# HDMI: the "HDMI0" card (I2S5 -> HDMI QP). Analog: the ES8388 card
# ("rockchip,es8388") on the 3.5 mm jack, unused while the display is HDMI
# (the frontend's sound follows the display).
audio_internal = auto
audio_hdmi = auto
audio_hdmi_pcm = plughw
cpu_governor_menu = schedutil
cpu_governor_game = performance
storage_overlays =
display_quirks =

# --- Init scripts (/usr/libexec/rsos/board.sh)
# The SD card (mmc0 = &sdmmc in the device tree: /dev/mmcblk0). The data
# partition is MBR entry 1 (physically last), as on the RetroStone2.
data_disk = /dev/mmcblk0
data_partition = 1
boot_reason = none
# rsos-net: the GMAC (dwmac-rk + YT8531C PHY) is built into the kernel. No
# on-board WiFi/Bluetooth (the M.2 E-key module is optional): Bluetooth
# works with a USB dongle (btusb).
wifi_module = none
wifi_sdio_host =
eth_modules =
bt_module = btusb

# --- Build (board/common/post-build.sh)
# Root shell on the debug UART (UART2, the 3-pin header, 1500000 8N1)
serial_console = ttyS2
