# RetroStoneOS SD card image for the RetroStone1 (A/B root filesystems),
# the RetroStone2 layout with 512 MiB slots.
#
# Disk order                                   MBR entry
#   0       MBR
#   8 KiB   u-boot-sunxi-with-spl.bin           -   (the boot ROM loads the SPL from 8 KiB)
#   1 MiB   U-Boot environment, 64 KiB          -   (A/B boot state; copy 1)
#   1 MiB + 64 KiB  environment, 64 KiB         -   (copy 2; up to 4 MiB reserved)
#   4 MiB   rootfs A, ext4, 512 MiB             2   (read-only, /boot inside)
#   516 MiB rootfs B, ext4, 512 MiB             3   (empty until the first update)
#   1028 MiB data, FAT32 seed "RETROSTONE", 128 MiB  1  (turned into a
#                                                    full-size exFAT by the first boot)
#
# The environment area is left zeroed (invalid CRC): U-Boot uses its default
# environment and boot.scr saves it once with the rsos_* variables. The data
# partition is the first MBR entry so that PCs (Windows in particular, which
# may only mount the first partition of removable media) show it.

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition data {
		partition-type = 0x0c
		image = "data.vfat"
		offset = 1028M
	}

	partition rootfs-a {
		partition-type = 0x83
		bootable = true
		image = "rootfs.ext4"
		offset = 4M
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		offset = 516M
		size = 512M
	}
}
