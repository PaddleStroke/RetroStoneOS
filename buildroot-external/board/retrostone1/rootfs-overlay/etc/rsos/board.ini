# RetroStoneOS board profile: RetroStone1 (8BCraft, Allwinner H3, no PMIC).
# Untested on hardware (docs/boards.md, "RetroStone1").
#
# Read once at start-up by the frontend and the game process
# (frontend/src/board.h), and by the init scripts
# (/usr/libexec/rsos/board.sh). Every key is optional: a missing key means
# auto-detection. See docs/porting.md for all the keys.

name = RetroStone1

# --- Frontend
# Built-in controls: gpio-keys-polled "RetroStone1 Buttons" and the MCP3208
# stick (adc-joystick "analog-stick", optional part)
builtin_pad_prefix = RetroStone1
builtin_stick = analog-stick
# The built-in screen is fed by the H3 composite output (TV encoder, kernel
# patch 0002 -> DRM connector "Composite-1") through the AMT630A converter,
# which scales it to the panel: it is the internal display, switched with
# HDMI on hotplug like the RetroStone2's LCD. Untested on hardware
# (docs/boards.md, "RetroStone1").
internal_display = composite
# ntsc = 720x480 interlaced at 59.94 Hz (the lower game latency), pal =
# 720x576 interlaced at 50 Hz; each falls back to the other when the kernel
# has no such mode or refuses it. auto = the kernel's preferred mode (NTSC,
# or PAL with video=Composite-1:PAL in rsos_extraargs). TODO(hw): which one
# the AMT630A firmware shows best.
tv_norm = ntsc
# Margin kept clear on each edge of the composite picture, in percent (0-20),
# if the AMT630A crops the edges (its OSD also has position/size settings).
tv_overscan = 0
internal_refresh_options =
# The backlight is switched by the AMT630A (and its side keys), not the SoC
backlight = none
# No fuel gauge: the MCP73871 charger reports to LEDs only, and the ADC input
# on VBAT has no divider (it saturates). No battery icon or overlay.
battery_supply = none
ac_supply = none
usb_supply = none
thermal_zone = auto
# The side key U$15 (gpio-keys "Power Key", KEY_POWER): short press = clean
# power-off. The slide switch cuts the power in hardware.
power_key_device = auto
pek_startup_ms = 0
# Built-in: "H3 Audio Codec" (line out -> volume wheel -> jack / speaker amp);
# HDMI: "allwinner-hdmi" (I2S2 -> HDMI). The sound follows the display: the
# codec on the built-in screen, HDMI on a TV.
audio_internal = auto
audio_hdmi = auto
audio_hdmi_pcm = plughw
cpu_governor_menu = schedutil
cpu_governor_game = performance
storage_overlays =
display_quirks =

# --- Init scripts (/usr/libexec/rsos/board.sh)
# The SD card (mmc0: /dev/mmcblk0). The data partition is MBR entry 1
# (physically last), as on the RetroStone2.
data_disk = /dev/mmcblk0
data_partition = 1
boot_reason = none
# rsos-net: no on-board WiFi or Bluetooth (test pads only; a USB Bluetooth
# dongle works: btusb). Ethernet (RJ45, H3 internal PHY) is the dwmac-sun8i
# module, loaded only when Ethernet is turned on.
wifi_module = none
wifi_sdio_host =
eth_modules = dwmac-sun8i
bt_module = btusb

# --- System updater (rsos-update, docs/updates.md)
# A/B through U-Boot's boot.scr and /etc/fw_env.config (board/sbc-uboot)
ab_update = auto

# --- Build (board/common/post-build.sh)
# Root shell on the debug UART (header UART0-DBG, PA4/PA5, 115200 8N1)
serial_console = ttyS0
