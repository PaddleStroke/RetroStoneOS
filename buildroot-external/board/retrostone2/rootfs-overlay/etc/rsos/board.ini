# RetroStoneOS board profile: RetroStone2 (Allwinner A20, AXP209)
#
# Read once at start-up by the frontend and the game process
# (frontend/src/board.h), and by the init scripts
# (/usr/libexec/rsos/board.sh). Every key is optional: a missing key (or a
# missing file) means auto-detection. See docs/porting.md for all the keys.
# The values here are the ones the RetroStone2 code used before the board
# profile existed (frontend/tests/test_board.c checks them).

name = RetroStone2

# --- Frontend
# Built-in controls: gpio-keys "RetroStone2 ..." and the AXP ADC stick
builtin_pad_prefix = RetroStone2
builtin_stick = analog-stick
# The 640x480 parallel RGB panel: sun4i_rgb registers its connector as
# "Unknown" (connector Unknown-1), not DPI
internal_display = unknown, dpi
# The panel's own 78.571 Hz mode, or the same timings retimed to 60 Hz
internal_refresh_options = 78, 60
backlight = auto
battery_supply = axp20x-battery
ac_supply = axp20x-ac
usb_supply = axp20x-usb
battery_voff_mv = 3000
thermal_zone = auto
# AXP209 power key (PEK): power-on hold time programmed at every start
power_key_device = axp20x-pek
pek_startup_ms = 128
# sun4i-codec (speaker / headphones) and sun4i-hdmi: found by name
audio_internal = auto
audio_hdmi = auto
cpu_governor_menu = schedutil
cpu_governor_game = performance
# Settings > Storage: the "Pro" variant's eMMC and M.2 SATA (U-Boot overlays)
storage_overlays = emmc sata
# sun4i-tcon0-clock: log the A20 TCON0 pixel clock model when the panel is
# retimed. panel-keep-scanning: the panel VCC is the always-on 3.3 V rail (no
# power GPIO), and a TFT must never stay powered with its signals stopped:
# screen off = backlight off + black frame with TCON0 still scanning, HDMI on
# TCON1 (docs/display-design.md 8.5, kernel patch 0006)
display_quirks = sun4i-tcon0-clock panel-keep-scanning

# --- Init scripts (board/common/rootfs-overlay/usr/libexec/rsos/board.sh)
# The SD card: the root filesystems (A/B) and the data partition (MBR
# entry 1, FAT32 seed turned into exFAT at the first boot)
data_disk = /dev/mmcblk0
data_partition = 1
# data-partition's first-boot trace (64 KiB, KiB from the start of the card):
# in the reserved gap between the U-Boot environment (1 MiB + 2 x 64 KiB)
# and rootfs A (4 MiB), outside every partition (genimage.cfg)
firstboot_trace_kib = 3072
# rsos-bootreason: power-on reason from the AXP209 (charge mode)
boot_reason = axp209
# rsos-net: AP6210 WiFi (brcmfmac) on the A20 mmc3 host, powered down by
# unbinding the host (TODO(hw): check the mmc3 node name against the DTS);
# A20 GMAC (dwmac-sunxi), sun4i-emac in case the PHY is on the EMAC;
# Bluetooth hci_uart (+ btbcm) on UART2
wifi_module = brcmfmac
wifi_sdio_host = 1c12000.mmc
wifi_sdio_driver = sunxi-mmc
eth_modules = dwmac-sunxi sun4i-emac
bt_module = hci_uart
# The AP6210 nvram has the Broadcom default MAC, which brcmfmac replaces
# with a random one at every load: use a stable MAC derived from the A20 SID
# instead (TODO(hw): check it on the device)
wifi_mac = sid

# --- System updater (rsos-update, docs/updates.md)
# In-place A/B updates: U-Boot's boot.cmd, /etc/fw_env.config, root
# filesystems A and B (auto: when /etc/fw_env.config exists and the kernel
# was started with rsos.slot=; 0: "flash the new image" instead)
ab_update = 1

# --- Build (board/common/post-build.sh)
# Root shell on the debug UART (uart0, PB22/PB23, 115200 8N1)
serial_console = ttyS0
