# RetroStoneOS board profile: Raspberry Pi 2 (also the Pi 3 / Zero 2 W in
# 32-bit mode), community-tested port (docs/boards.md). HDMI only, USB pads,
# no battery.
#
# Read by the frontend (frontend/src/board.h) and the init scripts
# (/usr/libexec/rsos/board.sh). Missing keys mean auto-detection; the
# values below mostly say "there is none" explicitly.

name = Raspberry Pi 2

# --- Frontend
# No built-in controls: USB (or Bluetooth) pads and keyboards
builtin_pad_prefix =
builtin_stick =
# No built-in screen: the TV on HDMI-A-1 (vc4). With nothing plugged in, the
# HDMI port is lit anyway (720p) and the menu shows up when a TV is connected.
internal_display = none
internal_refresh_options =
backlight = none
battery_supply = none
ac_supply = none
usb_supply = none
thermal_zone = auto
# No power button: any input device that is a power button (a GPIO
# "gpio-shutdown" overlay, a USB keyboard's power key) works.
power_key_device = auto
pek_startup_ms = 0
# vc4-hdmi takes IEC958 subframes only: alsa-lib's "hdmi" PCM of the card
# (/usr/share/alsa/cards/vc4-hdmi.conf). The 3.5 mm jack is off
# (config.txt dtparam=audio=off): the frontend's sound follows the display.
audio_internal = auto
audio_hdmi = auto
audio_hdmi_pcm = hdmi
cpu_governor_menu = schedutil
cpu_governor_game = performance
storage_overlays =
display_quirks =

# --- Init scripts (/usr/libexec/rsos/board.sh)
# The SD card: auto = the disk of root= on the kernel command line
# (cmdline.txt: root=/dev/mmcblk0p2). The data partition is MBR entry 4:
# entry 1 must be the FAT boot partition for the Pi firmware.
data_disk = auto
data_partition = 4
boot_reason = none
# rsos-net: Pi 3 / Zero 2 W WiFi (brcmfmac, SDIO; no SDIO host unbinding),
# Bluetooth on the mini UART (config.txt miniuart-bt). The Pi 2 has neither:
# rsos-net then finds no interface. Ethernet (USB SMSC95xx / LAN78xx) is
# built into the kernel.
wifi_module = brcmfmac
wifi_sdio_host =
eth_modules =
bt_module = hci_uart

# --- Build (board/common/post-build.sh)
# Root shell on the GPIO 14/15 UART: the PL011 (config.txt enable_uart=1,
# miniuart-bt on the Pi 3 / Zero 2 W)
serial_console = ttyAMA0
