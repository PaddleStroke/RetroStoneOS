# RetroStoneOS board profile: Raspberry Pi 5 / 500, community-tested port
# (docs/boards.md). HDMI only, USB pads, no battery.
#
# Read by the frontend (frontend/src/board.h) and the init scripts
# (/usr/libexec/rsos/board.sh). Missing keys mean auto-detection; the
# values below mostly say "there is none" explicitly.

name = Raspberry Pi 5

# --- Frontend
# No built-in controls: USB (or Bluetooth) pads and keyboards
builtin_pad_prefix =
builtin_stick =
# No built-in screen: the TV on HDMI-A-1 or HDMI-A-2 (vc4). With nothing
# plugged in, the first HDMI port is lit anyway (720p) and the menu moves
# to the TV when one is connected.
internal_display = none
internal_refresh_options =
backlight = none
battery_supply = none
ac_supply = none
usb_supply = none
thermal_zone = auto
# The Pi 5 has a power button: the kernel's "pwr_button" gpio-keys device
# reports KEY_POWER (auto finds it).
power_key_device = auto
pek_startup_ms = 0
# vc4-hdmi takes IEC958 subframes only: alsa-lib's "hdmi" PCM of the card
# (/usr/share/alsa/cards/vc4-hdmi.conf). The card of the port in use is
# picked (HDMI-A-2 -> the second vc4hdmi card). No analog output on a Pi 5.
audio_internal = auto
audio_hdmi = auto
audio_hdmi_pcm = hdmi
cpu_governor_menu = schedutil
cpu_governor_game = performance
storage_overlays =
display_quirks =

# --- Init scripts (/usr/libexec/rsos/board.sh)
# The SD card: auto = the disk of root= on the kernel command line
# (cmdline.txt: root=/dev/mmcblk0p2). The data partition is MBR entry 4:
# entry 1 must be the FAT boot partition for the Pi firmware.
data_disk = auto
data_partition = 4
boot_reason = none
# rsos-net: CYW43455 WiFi (brcmfmac, SDIO; no SDIO host unbinding), the
# RP1 Ethernet (macb) is built into the kernel, Bluetooth on an RP1 UART
wifi_module = brcmfmac
wifi_sdio_host =
eth_modules =
bt_module = hci_uart

# --- Build (board/common/post-build.sh)
# Root shell on the debug UART connector (ttyAMA10)
serial_console = ttyAMA10
