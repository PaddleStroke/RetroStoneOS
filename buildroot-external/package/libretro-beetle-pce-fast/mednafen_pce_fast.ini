; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = mednafen_pce_fast
display_name = Beetle PCE Fast
library = /usr/lib/libretro/mednafen_pce_fast_libretro.so
commit = 1c693c630121366f0b819d785762f1ce5b3a68d0
license = GPL-2.0+
systems = pcengine, pcenginecd
extensions = pce, cue, ccd, chd, toc, m3u
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565

; BIOS files live in the libretro system directory. HuCard games need none.
; CD games need a System Card image; the core loads syscard3.pce unless the
; "pce_fast_cdbios" option picks another one (syscard2.pce, syscard1.pce,
; gexpress.pce, syscard3u.pce, syscard2u.pce).
[bios:syscard3.pce]
md5 = 38179df8f4ac870017db21ebcbf53114
required = pcenginecd
description = PC Engine CD Super System Card 3.0 (Japan)

[bios:syscard2.pce]
md5 = 3cdd6614a918616bfc41c862e889dd79
required = no
description = PC Engine CD System Card 2.0 (only with pce_fast_cdbios = System Card 2)

[bios:syscard1.pce]
md5 = 2b7ccb3d86baa18f6402c176f3065082
required = no
description = PC Engine CD System Card 1.0 (only with pce_fast_cdbios = System Card 1)

[bios:gexpress.pce]
md5 = 6d2cb14fc3e1f65ceb135633d1694122
required = no
description = Games Express CD Card (only with pce_fast_cdbios = Games Express)
