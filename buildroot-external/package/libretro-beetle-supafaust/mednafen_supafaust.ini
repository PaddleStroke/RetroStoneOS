; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
; EXPERIMENTAL: licence-clean alternative for "snes". The default SNES core
; stays snes9x2005. See docs/cores.md "SNES: is there a GPL core light enough?".
[core]
id = mednafen_supafaust
display_name = Beetle Supafaust (experimental)
library = /usr/lib/libretro/mednafen_supafaust_libretro.so
commit = 642d1d1b6684aa7e306a02a89885f3f5456a5157
license = GPL-2.0+
systems = snes
extensions = smc, swc, sfc, fig
need_fullpath = false
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565
; Never picked as a folder's default core; offered as a per-game choice.
experimental = true

; No BIOS. Special chips (DSP-1/2, CX4, SuperFX, SA-1, S-DD1) are emulated
; without chip ROM files.

; Core option defaults the frontend applies unless a per-game setting
; overrides them.
[options]
supafaust_pixel_format = rgb565
; PPU on its own thread. The core forces "mt" at load anyway; stated here so
; the options menu shows the real state.
supafaust_renderer = mt
; Dual-core A20: emulation thread (the frontend thread that calls retro_run)
; pinned to CPU1, PPU render thread to CPU0. These are the upstream defaults
; and fit a 2-core SoC. The frontend's own audio/input threads then share
; CPU0 with the PPU. TODO(hw): try 0x0 (no pinning) for both and compare.
supafaust_thread_affinity_emu = 0x2
supafaust_thread_affinity_ppu = 0x1
; Upstream default; keeps input latency one frame lower.
supafaust_frame_begin_vblank = enabled
