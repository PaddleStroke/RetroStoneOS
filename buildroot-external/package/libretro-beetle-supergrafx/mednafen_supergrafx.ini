; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = mednafen_supergrafx
display_name = Beetle SuperGrafx
library = /usr/lib/libretro/mednafen_supergrafx_libretro.so
commit = 3c6fcd3deded54ebecd69408f108407ac03d11b5
license = GPL-2.0+
; ROM folder "supergrafx" (.sgx, and .pce HuCards that use the SuperGrafx
; mode). It also runs PC Engine HuCards and CD games: a per-game
; alternative to mednafen_pce_fast in pcengine / pcenginecd.
systems = supergrafx, pcengine, pcenginecd
default_systems = supergrafx
extensions = sgx, pce, cue, ccd, chd, toc, m3u
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565

; Same System Card files as mednafen_pce_fast, in the system directory.
; HuCards and SuperGrafx cards need none; CD games need syscard3.pce unless
; the "sgx_cdbios" option picks another one.
[bios:syscard3.pce]
md5 = 38179df8f4ac870017db21ebcbf53114
required = pcenginecd
description = PC Engine CD Super System Card 3.0 (Japan)

[bios:syscard2.pce]
md5 = 3cdd6614a918616bfc41c862e889dd79
required = no
description = PC Engine CD System Card 2.0 (only with sgx_cdbios = System Card 2)

[bios:syscard1.pce]
md5 = 2b7ccb3d86baa18f6402c176f3065082
required = no
description = PC Engine CD System Card 1.0 (only with sgx_cdbios = System Card 1)

[bios:gexpress.pce]
md5 = 6d2cb14fc3e1f65ceb135633d1694122
required = no
description = Games Express CD Card (only with sgx_cdbios = Games Express)
