; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = bluemsx
display_name = blueMSX
library = /usr/lib/libretro/bluemsx_libretro.so
commit = e3086eb5d36d77fa11704cf53dc176686e70127d
license = Zlib, GPL-2.0+, BSD-2-Clause
systems = msx
extensions = rom, ri, mx1, mx2, dsk, col, sg, sc, sf, cas, m3u
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565
; Directory tree the frontend copies into the libretro system directory
; before the first MSX game, file by file, keeping relative paths and never
; overwriting an existing file (see docs/cores.md, "system_tree"). It holds
; Databases/*.xml and the C-BIOS machines (Machines/MSX, MSX2, MSX2+ point
; at C-BIOS).
system_tree = /usr/share/rsos/cores/bluemsx

; No required BIOS file: C-BIOS (shipped) runs cartridge images. Disk (.dsk)
; and tape (.cas) games need Disk BASIC / MSX-BASIC, which C-BIOS lacks: the
; user then copies the full blueMSX "Machines" folder with the original MSX
; system ROMs ("Machines/Shared Roms/MSX2P.rom", ...) into the system
; directory, which replaces the C-BIOS aliases. Those ROMs are copyrighted
; and never shipped.
[bios:Machines/Shared Roms/MSX2P.rom]
required = no
description = MSX2+ main ROM, only for disk and tape games (part of the blueMSX Machines folder)

[options]
; Auto picks the machine from the file extension (MSX2+ for rom/dsk/cas,
; ColecoVision for .col, SG-1000/SC-3000 for .sg/.sc).
bluemsx_msxtype = Auto
