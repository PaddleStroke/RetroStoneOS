; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = cap32
display_name = Caprice32
library = /usr/lib/libretro/cap32_libretro.so
commit = 1abeaac1589156bc1c968015337595cce4d853d6
license = GPL-2.0+
; ROM folder "amstradcpc": disks (.dsk), snapshots (.sna), tapes (.cdt,
; .tap, .voc), 6128+/GX4000 cartridges (.cpr). The core auto-starts the
; first program of a disk (cap32_autorun).
systems = amstradcpc
default_systems = amstradcpc
extensions = dsk, sna, tap, cdt, voc, cpr, m3u
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565, xrgb8888

; No BIOS: the CPC 464/664/6128/6128+ ROMs and AMSDOS are built into the
; core (Amstrad allows their distribution with emulators).
