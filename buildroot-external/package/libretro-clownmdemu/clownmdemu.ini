; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
; EXPERIMENTAL: licence-clean alternative for "megadrive" and "segacd". The
; default core for both stays picodrive. See docs/cores.md "Mega Drive: is
; there a GPL core light enough?". AGPL-3.0+: see "AGPL obligations".
[core]
id = clownmdemu
display_name = ClownMDEmu (experimental)
library = /usr/lib/libretro/clownmdemu_libretro.so
commit = 0f23a1696581f6969cfc78cc763af492c4bb3fd6
license = AGPL-3.0+
systems = megadrive, segacd
extensions = bin, md, gen, cue, iso, chd
need_fullpath = true
block_extract = false
savestates = true
renderer = software
; rgb565 first; the core falls back to xrgb8888 if rgb565 is refused.
pixel_format = rgb565, xrgb8888
; Never picked as a folder's default core; offered as a per-game choice.
experimental = true

; No BIOS: Mega-CD discs boot without a BIOS file (the core does not read
; anything from the system directory; Mega-CD backup RAM goes to the save
; directory).
