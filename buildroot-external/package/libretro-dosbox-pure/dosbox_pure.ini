; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = dosbox_pure
display_name = DOSBox Pure
library = /usr/lib/libretro/dosbox_pure_libretro.so
commit = 73e03aa145e0549ed4d5a20f8e65532714da33f5
license = GPL-2.0+
; ROM folder "dos": one .zip (or .dosz) per game is the recommended layout.
; The core mounts the zip as drive C: and offers the executables in its
; start menu (then remembers the choice). CD images (.iso/.cue/.chd) and
; floppy/HDD images (.img/.ima/.vhd) work too. Unzipped game folders are
; not listed: the scan would show every .exe inside them.
systems = dos
default_systems = dos
extensions = zip, dosz, iso, cue, chd, img, ima, vhd, m3u, conf
need_fullpath = true
; The core opens .zip files itself (mounted as a drive): never extract.
block_extract = true
savestates = true
renderer = software
pixel_format = xrgb8888

; No BIOS. Optional: General MIDI soundfonts (.sf2) or MT-32 ROMs in the
; system directory, selected with the dosbox_pure_midi option.

[options]
; Tuned for a 1 GHz Cortex-A7 (386/486-class DOS games). TODO(hw): measure.
; auto: real-mode games run on the interpreter, protected-mode games on
; the dynamic recompiler (ARMv7 dynrec).
dosbox_pure_cpu_core = auto
; auto: DOSBox adapts the emulated speed; the emulation may use at most
; the cycle limit share of each frame, leaving the rest to the frontend.
dosbox_pure_cycles = auto
; A lower mixer rate makes the OPL (AdLib) and Sound Blaster mixing cheaper;
; 32 kHz keeps most of the treble on the handheld speaker.
dosbox_pure_audiorate = 32000
dosbox_pure_sblaster_adlib_emu = default
