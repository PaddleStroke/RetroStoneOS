; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = fake08
display_name = FAKE-08
library = /usr/lib/libretro/fake08_libretro.so
commit = 814991a2571ad3970e386cef48f3b148aa1c27b9
license = MIT
; ROM folder "pico8": PICO-8 carts as .p8 (text) or .p8.png (image carts,
; as downloaded from the Lexaloffle BBS). Cover art belongs in media/ or
; images/, which the scan skips, so it is not mistaken for a cart.
systems = pico8
default_systems = pico8
extensions = p8, png
need_fullpath = false
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565

; No BIOS: FAKE-08 is a re-implementation of the PICO-8 API (MIT). The
; official PICO-8 (Lexaloffle, commercial) is not used.
