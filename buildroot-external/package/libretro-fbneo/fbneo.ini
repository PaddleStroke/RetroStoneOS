; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = fbneo
display_name = FinalBurn Neo
library = /usr/lib/libretro/fbneo_libretro.so
commit = aceeebed9e7edc8a28652365a064baee9a16e274
license = FBNeo non-commercial
systems = fbneo, neogeo
extensions = zip, 7z
need_fullpath = true
block_extract = true
savestates = true
renderer = software
pixel_format = rgb565, xrgb8888

; Arcade BIOS sets are zip files and are not checked by md5: put them next to
; the games (same ROM folder) or in <system dir>/fbneo/. Samples go to
; <system dir>/fbneo/samples/, hiscore.dat to <system dir>/fbneo/.
[bios:neogeo.zip]
required = neogeo
description = Neo Geo BIOS set (FBNeo romset), also needed by every Neo Geo game in the fbneo folder
