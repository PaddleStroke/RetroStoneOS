; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = fuse
display_name = Fuse
library = /usr/lib/libretro/fuse_libretro.so
commit = e997e2bc32c888348f862f69f2c53babfedf7791
license = GPL-3.0 (port), GPL-2.0+ (Fuse)
; ROM folder "zxspectrum": tapes (.tzx/.tap), snapshots (.z80/.sna/.szx),
; disks (+3 .dsk, Beta 128 .trd/.scl), cartridges (.dck), recordings (.rzx).
; The core reads .zip itself.
systems = zxspectrum
default_systems = zxspectrum
extensions = tzx, tap, z80, rzx, scl, trd, dsk, dck, sna, szx, zip, m3u
need_fullpath = false
block_extract = true
savestates = true
renderer = software
pixel_format = rgb565

; No BIOS: the Spectrum ROMs are built into the core (Amstrad allows their
; distribution with emulators; see the package's README.copyright).
; RetroPad Select shows the core's keyboard overlay (Spectrum keyboard).
