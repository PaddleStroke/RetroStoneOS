; names.
[bios:dmg_boot.bin]
md5 = 32fbbd84168d3482956eb3c5051637f5
required = no
description = Game Boy boot ROM (DMG)

[bios:cgb_boot.bin]
md5 = dbfce9db9deaa2567f6a84fde55f9680
required = no
description = Game Boy Color boot ROM (CGB)
