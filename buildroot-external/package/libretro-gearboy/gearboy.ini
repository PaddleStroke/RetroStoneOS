; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = gearboy
display_name = Gearboy
library = /usr/lib/libretro/gearboy_libretro.so
commit = 1f2ef68a5a43f2b6cdaa4fdf1b462c772d5d31d3
license = GPL-3.0
systems = gb, gbc
extensions = gb, dmg, gbc, cgb, sgb
need_fullpath = false
