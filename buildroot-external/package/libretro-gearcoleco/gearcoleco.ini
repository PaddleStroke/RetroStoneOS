; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = gearcoleco
display_name = Gearcoleco
library = /usr/lib/libretro/gearcoleco_libretro.so
commit = 8d32d242c6ba2104d75c17bb79773275387d4c37
license = GPL-3.0
systems = coleco
; The core also accepts "zip" and reads the archive itself; the frontend's
; own zip handling is enough, so zip is not listed here.
extensions = col, cv, bin, rom, ddp, dsk, m3u
need_fullpath = false
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565

; BIOS files live in the libretro system directory (or its gearcoleco/
; subdirectory). The core also accepts the names coleco.rom and os7.u2.
; Coleco ADAM (.ddp/.dsk) additionally needs eos.rom and writer.rom.
[bios:colecovision.rom]
md5 = 2c66f5911e5b42b8ebe113403548eee7
required = yes
description = ColecoVision BIOS (OS-7, CRC32 3aa93ef3)
