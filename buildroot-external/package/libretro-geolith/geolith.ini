; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
; EXPERIMENTAL: licence-clean alternative for Neo Geo. The default Neo Geo
; core stays fbneo. Geolith does not read MAME/FBNeo .zip romsets: cartridges
; must be converted to TerraOnion's .neo format first. See docs/cores.md
; "Neo Geo: Geolith".
[core]
id = geolith
display_name = Geolith (experimental)
library = /usr/lib/libretro/geolith_libretro.so
commit = 194024931935eff2092e36fc4f8e53e62ed11097
license = BSD-3-Clause
systems = neogeo, neocd
extensions = neo, chd, cue
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = xrgb8888
; Never picked as a folder's default core; offered as a per-game choice.
experimental = true

; BIOS files live in the libretro system directory, as zip files from a
; recent MAME set (no md5: the core opens the zips and picks the ROMs inside
; by name). Which zip is needed depends on the "geolith_system_type" option
; (cartridges; default aes) and "geolith_cd_system_type" (CD; default cdz).
[bios:aes.zip]
required = neogeo
description = Neo Geo AES BIOS (MAME set), for geolith_system_type = aes (default)

[bios:neogeo.zip]
required = no
description = Neo Geo MVS BIOS and Universe BIOS (MAME set), for geolith_system_type = mvs or uni

[bios:neocdz.zip]
required = neocd
description = Neo Geo CDZ BIOS (MAME set); also needed for the front/top-loader CD models

[bios:neocd.zip]
required = no
description = Neo Geo CD front/top-loader BIOS (MAME set), for geolith_cd_system_type = cd_front or cd_top
