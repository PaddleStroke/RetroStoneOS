; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = handy
display_name = Handy
library = /usr/lib/libretro/handy_libretro.so
commit = bc55d462f0b2d6b073ea93dc552ebd73cec60fd1
license = Zlib, LGPL-2.1+, GPL-2.0+
systems = atarilynx
extensions = lnx, lyx, o
need_fullpath = false
block_extract = false
savestates = true
renderer = software
; rgb565 by default; xrgb8888 only if handy_gfx_colors = 24bit.
pixel_format = rgb565, xrgb8888

; BIOS files live in the libretro system directory. Optional: without the boot
; ROM the core boots cartridges with its built-in HLE of the boot code, which
; works for most .lnx images. TODO(hw): list games that need the real ROM.
[bios:lynxboot.img]
md5 = fcd403db69f54290b51035d82f835e7b
required = no
description = Atari Lynx boot ROM
