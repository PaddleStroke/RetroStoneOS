; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = mame2003_plus
display_name = MAME 2003-Plus
library = /usr/lib/libretro/mame2003_plus_libretro.so
commit = 546424f3cd46674e996867ac26bd1060011739df
license = MAME non-commercial
systems = arcade
extensions = zip
need_fullpath = true
block_extract = true
savestates = true
renderer = software
pixel_format = rgb565, xrgb8888, 0rgb1555

; Arcade BIOS sets are zip files (neogeo.zip, pgm.zip, decocass.zip, ...) and
; are not checked by md5: put them in the same ROM folder as the games.
; Optional support files (hiscore.dat, cheat.dat, history.dat, samples/) go to
; <system dir>/mame2003-plus/.
[bios:neogeo.zip]
required = no
description = Neo Geo BIOS set (MAME 2003-Plus romset), only for Neo Geo games
