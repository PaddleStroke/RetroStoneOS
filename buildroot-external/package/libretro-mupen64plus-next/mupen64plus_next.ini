; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
; EXPERIMENTAL on Mali-400 / lima, see docs/cores.md "Nintendo 64".
[core]
id = mupen64plus_next
display_name = Mupen64Plus-Next (GLES2, experimental)
library = /usr/lib/libretro/mupen64plus_next_libretro.so
commit = 6752836de8b224febfd5708444755b77712ac939
license = GPL-2.0
systems = n64
extensions = n64, v64, z64, bin, u1
need_fullpath = false
block_extract = false
savestates = true
renderer = gles2
pixel_format = xrgb8888

; Core option defaults the frontend applies unless a per-game setting
; overrides them: the cheapest GLideN64 settings for Mali-400 (lima, GLES2,
; fp16), modelled on the core's own VideoCore defaults. docs/cores.md
; "N64 performance".
[options]
mupen64plus-rdp-plugin = gliden64
mupen64plus-rsp-plugin = hle
mupen64plus-cpucore = dynamic_recompiler
; native resolution, no upscaling (fill rate), no MSAA/FXAA
mupen64plus-43screensize = 320x240
mupen64plus-EnableNativeResFactor = 0
mupen64plus-BilinearMode = standard
mupen64plus-HybridFilter = False
mupen64plus-DitheringPattern = False
mupen64plus-RDRAMImageDitheringMode = False
mupen64plus-FXAA = 0
; Framebuffer emulation (and the RDRAM copies that go with it) is the most
; expensive part of GLideN64; some games need it (Zelda pause screen,
; Banjo, motion blur): GLideN64's own per-game ini enables it for them
; ("late" = its per-game settings win).
mupen64plus-EnableFBEmulation = False
mupen64plus-EnableCopyColorToRDRAM = Off
mupen64plus-EnableCopyDepthToRDRAM = Off
mupen64plus-EnableCopyAuxToRDRAM = False
mupen64plus-GLideN64IniBehaviour = late
mupen64plus-EnableLODEmulation = False
mupen64plus-EnableHWLighting = False
mupen64plus-EnableLegacyBlending = True
mupen64plus-BackgroundMode = OnePiece
; Cache compiled shaders in the system directory (OES_get_program_binary,
; exposed by lima): no shader-compile stutter on later runs. Not declared
; by the GLES2 build, but the core reads it (the frontend answers from here).
mupen64plus-EnableShadersStorage = True
mupen64plus-FrameDuping = True
mupen64plus-Framerate = Original
mupen64plus-CountPerOp = 0
; GLideN64 on the second CPU core (the frontend implements the RetroArch
; thread-wait call it needs). Per game until measured: the benchmark tries it.
mupen64plus-ThreadedRenderer = False
