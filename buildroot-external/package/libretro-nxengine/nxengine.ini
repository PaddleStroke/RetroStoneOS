; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = nxengine
display_name = NXEngine
library = /usr/lib/libretro/nxengine_libretro.so
commit = fd1c0686f8b4c0aea9b5addbc077e3ad7da23bb7
license = GPL-3.0
; ROM folder "cavestory": the freeware Cave Story 1.0.0.6 (English, Aeon
; Genesis) as Doukutsu.exe with its data/ folder next to it. The core reads
; everything from the folder of the .exe. Pre-installed when the image is
; built with BR2_PACKAGE_LIBRETRO_NXENGINE_CAVESTORY.
systems = cavestory
default_systems = cavestory
extensions = exe
need_fullpath = true
block_extract = false
; No libretro save states (retro_serialize returns false): the game saves
; at its own save points (Profile.dat).
savestates = false
renderer = software
pixel_format = rgb565

; No BIOS. Profile.dat goes to the libretro save directory.
