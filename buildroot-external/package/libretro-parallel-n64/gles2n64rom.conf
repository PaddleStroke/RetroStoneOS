#Per-game settings for the gln64 (gles2n64) renderer of parallel-n64, read from
#<libretro system dir>/gles2n64rom.conf (the frontend copies this file there once;
#an existing copy is never overwritten).
#
#This build only reads these keys (gles2n64/src/glN64Config.c): video width,
#video height, enable noise, enable lod, texture max anisotropy, texture use IA,
#texture fast CRC, bilinear mode, hack alpha, hack z. Unknown keys are ignored
#without a message.
#
#The RetrOrangePi file carried "target FPS", "framebuffer enable", "update mode",
#"hack zelda", "hack banjo tooie", "ignore offscreen rendering" and "force screen
#clear": those belong to the standalone ricrpi gles2n64 and do nothing in the
#libretro port, so they were dropped. Frameskip is now the core option
#parallel-n64-frameskip (RetroStoneOS patch), for every renderer.

rom name=THE LEGEND OF ZELDA
texture use IA=0

rom name=ZELDA MAJORA'S MASK
texture use IA=0
