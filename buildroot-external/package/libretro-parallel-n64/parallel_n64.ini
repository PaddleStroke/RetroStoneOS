; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = parallel_n64
display_name = ParaLLEl-N64 (GLES2)
library = /usr/lib/libretro/parallel_n64_libretro.so
commit = 6e4c44c51885c8dc16e46d68464c517e6fca6712
license = GPL-2.0
systems = n64
extensions = n64, v64, z64, bin, u1, ndd, zip
need_fullpath = true
block_extract = false
savestates = true
renderer = gles2
pixel_format = xrgb8888
; Files the frontend copies into the libretro system directory before the
; first N64 game (only if they are not there yet, so users can edit them).
system_files = /usr/share/rsos/cores/parallel_n64/gles2n64rom.conf

; Core option defaults the frontend applies unless a per-game setting
; overrides them (the same values as frontend/src/host/coreopts/
; parallel_n64.ini). Upstream defaults ("gliden64", "veryhigh") are wrong
; for a GLES2 build on Mali-400. Rationale: docs/cores.md "N64 performance".
[options]
; rice: fast GLES2 renderer (recommended for the Pi by Lakka). Per game:
; glide64 (more compatible, heavier), gln64 (lightest, broken in places).
parallel-n64-gfxplugin = rice
parallel-n64-gfxplugin-accuracy = low
parallel-n64-rspplugin = hle
parallel-n64-cpucore = dynamic_recompiler
; Internal render size; the display plane scales it to the LCD/TV.
parallel-n64-screensize = 320x240
; 0001-libretro-count-per-op-and-frameskip-core-options.patch:
; frameskip only while the frontend's audio buffer runs low;
; CountPerOp 0 = the ROM database.
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 0
parallel-n64-virefresh = auto
