; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = pcsx_rearmed
display_name = PCSX ReARMed
library = /usr/lib/libretro/pcsx_rearmed_libretro.so
commit = ff81ed17a15241d2f3730cdd7585b38e172532ca
license = GPL-2.0+
systems = psx
extensions = bin, cue, img, mdf, pbp, toc, cbn, m3u, chd, iso, exe
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565, xrgb8888

; BIOS files live in the libretro system directory. All optional: without one
; the core uses its HLE BIOS (less compatible; memory card management and some
; games need a real BIOS). The core searches, in order: scph5500 (JP),
; scph5501 (US), scph5502 (EU), psxonpsp660, scph101, scph7001, scph1001.
[bios:scph5501.bin]
