; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = picodrive
display_name = PicoDrive
library = /usr/lib/libretro/picodrive_libretro.so
commit = ab021146b70eef7ec0ac2afe06a94e9b4c16ef74
license = PicoDrive non-commercial
systems = megadrive, mastersystem, gamegear, sg1000, sega32x, segacd, pico
extensions = bin, gen, smd, md, 32x, cue, iso, chd, m3u, sms, gg, sg, sc, 68k, sgd, pco
need_fullpath = true
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565

; BIOS files live in the libretro system directory. Only Mega-CD / Sega CD
; needs a BIOS; the region of the disc picks the file. PicoDrive also accepts
; the MAME-style names (us_scd2_9306.bin, eu_mcd2_9306.bin, jp_mcd2_921222.bin...).
[bios:bios_CD_U.bin]
md5 = 2efd74e3232ff260e371b99f84024f7f
required = segacd
description = Sega CD BIOS (USA)

[bios:bios_CD_E.bin]
md5 = e66fa1dc5820d254611fdcdba0662372
required = segacd
description = Mega-CD BIOS (Europe)

[bios:bios_CD_J.bin]
md5 = 278a9397d192149e84e820ac621a8edd
required = segacd
description = Mega-CD BIOS (Japan)
