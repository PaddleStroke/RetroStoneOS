; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = prboom
display_name = PrBoom
library = /usr/lib/libretro/prboom_libretro.so
commit = d20300de2d32e5b8e8b0a0f15b1e1a889583d248
license = GPL-2.0+
; ROM folder "doom": IWADs (doom.wad, doom2.wad, plutonia.wad, tnt.wad,
; freedoom1.wad, freedoom2.wad) and PWADs. A PWAD is started with the IWAD
; found next to it (or in the system directory). rsos-freedoom pre-installs
; freedoom1.wad and freedoom2.wad.
systems = doom
default_systems = doom
extensions = wad, iwad, pwad, lmp, pk3, ipk3, m3u
need_fullpath = true
; .zip is opened by the core itself (a WAD plus its extras), but a zipped
; PWAD cannot find its IWAD: keep WADs unzipped, so no zip here.
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565, xrgb8888

; No BIOS: prboom.wad (the engine resources) is compiled into the core.
