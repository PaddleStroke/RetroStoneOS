; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = prosystem
display_name = ProSystem
library = /usr/lib/libretro/prosystem_libretro.so
commit = 8a88014287c7a01cd568067e5a557d0a2b2a051f
license = GPL-2.0+
systems = atari7800
extensions = a78, bin, cdf
need_fullpath = false
block_extract = false
savestates = true
renderer = software
; rgb565 by default; xrgb8888 only if prosystem_color_depth = 24bit.
pixel_format = rgb565, xrgb8888

; BIOS files live in the libretro system directory. Both optional: without
; them the core skips the boot animation and starts the cartridge directly.
; The core picks the (E) file for PAL cartridges and the (U) file otherwise.
; The section names contain spaces and parentheses: they are the exact file
; names the core opens.
[bios:7800 BIOS (U).rom]
md5 = 0763f1ffb006ddbe32e52d497ee848ae
required = no
description = Atari 7800 BIOS (NTSC)

[bios:7800 BIOS (E).rom]
md5 = 397bb566584be7b9764e7a68974c4263
required = no
description = Atari 7800 BIOS (PAL)
