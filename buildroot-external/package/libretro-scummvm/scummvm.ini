; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = scummvm
display_name = ScummVM
library = /usr/lib/libretro/scummvm_libretro.so
commit = fcbce3ae815269dacdc309092bc92ccc6d3e13bb
license = GPL-3.0+
; ROM folder "scummvm": one folder per game with the game's data files and
; a small text file <Game name>.scummvm next to them that holds the
; ScummVM game id, e.g. roms/scummvm/Beneath a Steel Sky/sky.scummvm
; containing "sky" (ids: https://www.scummvm.org/compatibility/). The file
; name is what the game list shows. The core then starts the game from
; that folder with default settings (docs/cores.md, "ScummVM").
systems = scummvm
default_systems = scummvm
extensions = scummvm
need_fullpath = true
block_extract = false
; ScummVM has no libretro save states: games save with their own save menu
; (to the save directory).
savestates = false
renderer = software
pixel_format = rgb565, xrgb8888
; Engine data files and GUI themes: copied into the system directory
; (<system>/scummvm/extra, <system>/scummvm/theme) before the first game.
system_tree = /usr/share/rsos/cores/scummvm

; No BIOS. Optional: Roland_SC-55.sf2 or MT-32 ROMs are not used by this
; build (no FluidSynth, no MT-32 emulation).
