; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = smsplus
display_name = SMS Plus GX
library = /usr/lib/libretro/smsplus_libretro.so
commit = 3844b46caa926b6494987b97da63092818c4ddef
license = GPL-2.0+
systems = mastersystem, gamegear, sg1000, coleco
extensions = sms, bin, rom, col, gg, sg
need_fullpath = false
block_extract = false
savestates = true
renderer = software
pixel_format = rgb565

; BIOS files live in the libretro system directory. bios.sms is optional
; (the "smsplus_sms_bios" option decides whether it runs at power-on).
; ColecoVision games (.col) do not start without BIOS.col: note the case.
[bios:bios.sms]
md5 = 840481177270d5642a14ca71ee72844c
required = no
description = Master System BIOS (US/EU v1.3)

[bios:BIOS.col]
md5 = 2c66f5911e5b42b8ebe113403548eee7
required = coleco
description = ColecoVision BIOS (same file as gearcoleco's colecovision.rom)
