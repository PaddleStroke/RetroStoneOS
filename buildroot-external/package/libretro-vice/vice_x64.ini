; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = vice_x64
display_name = VICE x64
library = /usr/lib/libretro/vice_x64_libretro.so
commit = 9d7983826ea792f6cce7fdfe6c09488129c6f886
license = GPL-2.0+
; ROM folder "c64": disks (.d64/.g64/...), tapes (.t64/.tap), programs
; (.prg/.p00), cartridges (.crt), .m3u for multi-disk games. The core reads
; .zip/.7z/.gz itself and autostarts the program.
systems = c64
default_systems = c64
extensions = d64, d71, d80, d81, d82, g64, g41, x64, t64, tap, prg, p00, crt, bin, zip, 7z, gz, d6z, d7z, d8z, g6z, g4z, x6z, cmd, m3u, vfl, vsf, nib, nbz, d2m, d4m
need_fullpath = true
block_extract = true
savestates = true
renderer = software
pixel_format = rgb565, xrgb8888

; No BIOS: the C64 KERNAL/BASIC/character ROMs and the 1541 drive ROM are
; compiled into the core by upstream (vice/include/embedded).

[options]
; reSID with fast sampling: the accurate SID at the lowest cost.
; TODO(hw): if a game stutters, FastSID is the cheaper engine.
vice_sid_engine = ReSID
vice_resid_sampling = fast
vice_sound_sample_rate = 44100
