; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = bombermole
display_name = Bomber Mole
library = /usr/lib/libretro/bombermole_libretro.so
; the RetroStone VC commit the core was built from (set at install)
commit = unknown
license = Proprietary (8BCraft, all rights reserved), MIT (RetroStone VC SDK)
; A RetroStone VC game (docs/vc-games.md): the game is inside the core, there
; is no ROM. The menu lists /usr/share/rsos/games/retrostone/Bomber Mole.bombermole,
; a stub it never reads (the extension picks this core); the host calls
; retro_load_game(NULL) and names the saves after it:
; /data/saves/retrostone/Bomber Mole.srm.
systems = retrostone
default_systems = retrostone
extensions = bombermole
no_content = true
need_fullpath = false
block_extract = true
; retro_serialize() returns false (RetroStone VC SDK): no save states and no
; auto state, so no resume either. The game saves its progress in its 32 KiB
; battery RAM (.srm), written like any core's SRAM.
savestates = false
renderer = software
pixel_format = rgb565

; No BIOS. Input: a SNES-layout RetroPad on ports 1-4 (docs/vc-games.md).
