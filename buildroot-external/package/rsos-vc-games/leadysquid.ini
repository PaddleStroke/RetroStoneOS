; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = leadysquid
display_name = Leady Squid
library = /usr/lib/libretro/leadysquid_libretro.so
; the RetroStone VC commit the core was built from (set at install)
commit = unknown
license = MIT (code: game, RetroStone VC SDK), CC-BY-NC-SA-4.0 (art, music, sound, levels)
; A RetroStone VC game (docs/vc-games.md): the game is inside the core, there
; is no ROM. The menu lists /usr/share/rsos/games/retrostone/Leady Squid.leadysquid,
; a stub it never reads (the extension picks this core); the host calls
; retro_load_game(NULL) and names the saves after it:
; /data/saves/retrostone/Leady Squid.srm.
systems = retrostone
default_systems = retrostone
extensions = leadysquid
no_content = true
need_fullpath = false
block_extract = true
; Save states (the RetroStone VC SDK serializes the whole console: docs/vc-games.md):
; the in-game menu's slots, the auto state and the resume work as for any core,
; in /data/states/retrostone/. A state never holds the battery save: the
; progress stays in the .srm. States are refused across game builds.
savestates = true
renderer = software
pixel_format = rgb565

; No BIOS. Input: a SNES-layout RetroPad on ports 1-4 (docs/vc-games.md).
