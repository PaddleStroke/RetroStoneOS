; RetroStoneOS benchmark plan for the n64 system: in-game menu (Select+X) >
; "Benchmark this game". Format and flow: docs/host-design.md §18.
;
; Every configuration restarts the game from the state saved when the
; benchmark started, with no input, unthrottled, for `warmup` + `seconds`.
; Keys other than label/core are core options (or the host key
; rsos-glthread) forced for that run only; "Use this for this game" writes
; the best configuration's keys to the per-game options file, so each
; configuration lists every key the plan varies (a user's per-game value
; must not leak into another run). frameskip "auto" measures as "no skip"
; (the benchmark runs without audio) and keeps auto frameskip for play.
; Configurations whose core is not installed are left out.

[bench]
seconds = 25
warmup = 5

[rice]
label = Rice 320x240
parallel-n64-gfxplugin = rice
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 0
rsos-glthread = false

[glide64]
label = Glide64 320x240
parallel-n64-gfxplugin = glide64
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 0
rsos-glthread = false

[gln64]
label = gln64 320x240
parallel-n64-gfxplugin = gln64
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 0
rsos-glthread = false

[rice-cpo3]
label = Rice, Count Per Op 3
parallel-n64-gfxplugin = rice
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 3
rsos-glthread = false

[rice-skip1]
label = Rice, frameskip 1
parallel-n64-gfxplugin = rice
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = 1
parallel-n64-CountPerOp = 0
rsos-glthread = false

[glide64-skip1]
label = Glide64, frameskip 1
parallel-n64-gfxplugin = glide64
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = 1
parallel-n64-CountPerOp = 0
rsos-glthread = false

[rice-glthread]
label = Rice, Mesa GL thread
parallel-n64-gfxplugin = rice
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 320x240
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 0
rsos-glthread = true

[rice-640]
label = Rice 640x480
parallel-n64-gfxplugin = rice
parallel-n64-gfxplugin-accuracy = low
parallel-n64-screensize = 640x480
parallel-n64-frameskip = auto
parallel-n64-CountPerOp = 0
rsos-glthread = false

[m64p]
label = Mupen64Plus-Next GLideN64
core = mupen64plus_next
mupen64plus-rdp-plugin = gliden64
mupen64plus-43screensize = 320x240
mupen64plus-EnableFBEmulation = False
mupen64plus-ThreadedRenderer = False
mupen64plus-CountPerOp = 0
rsos-glthread = false

[m64p-threaded]
label = Mupen64Plus-Next, threaded
core = mupen64plus_next
mupen64plus-rdp-plugin = gliden64
mupen64plus-43screensize = 320x240
mupen64plus-EnableFBEmulation = False
mupen64plus-ThreadedRenderer = True
mupen64plus-CountPerOp = 0
rsos-glthread = false
