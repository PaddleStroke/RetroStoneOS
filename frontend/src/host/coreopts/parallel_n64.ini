; RetroStoneOS default core options for ParaLLEl-N64 (layer 2, see
; docs/host-design.md §5; the same values as the package's [options]).
; Chosen for speed on the dual Cortex-A7 + Mali-400 (lima); rationale and
; sources in docs/cores.md, "N64 performance". Per game, the in-game menu's
; "Benchmark this game" measures the alternatives and can save the best.
;
; rice: the fast GLES2 renderer recommended for the Raspberry Pi (Lakka's
; parallel-n64 notes); glide64 (the old default) is more compatible and
; heavier; gln64 is the lightest but known broken in places on GLES2.
parallel-n64-gfxplugin = "rice"
parallel-n64-gfxplugin-accuracy = "low"
parallel-n64-rspplugin = "hle"
parallel-n64-cpucore = "dynamic_recompiler"
; the internal render size; the display plane scales it to the screen
parallel-n64-screensize = "320x240"
; RetroStoneOS core patch: skip whole frames (their display lists are not
; drawn) only while the audio buffer runs low, at most 3 in a row
parallel-n64-frameskip = "auto"
; 0 = the ROM database (2 for most games); 3 is faster but can slow some
; games down in-game: a per-game choice (the benchmark tries it)
parallel-n64-CountPerOp = "0"
parallel-n64-virefresh = "auto"
