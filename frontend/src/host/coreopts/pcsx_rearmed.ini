; RetroStoneOS default core options for PCSX ReARMed (see picodrive.ini).
; ARM dynarec and the built-in NEON GPU; no enhanced resolution (too slow
; on a 1 GHz A7); frameskip off by default (per game: "auto", which uses
; the host's audio buffer status callback).
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_show_bios_bootlogo = "disabled"
