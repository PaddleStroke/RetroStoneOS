; RetroStoneOS input remap: MS-DOS (dosbox_pure) on units WITH the optional
; C/Z front buttons (Settings > Controls > "Extra C/Z buttons fitted",
; settings.ini cz_buttons=1). Format: see megadrive.ini.
;
; The physical C button (PH3) already reports RetroPad L3, DOSBox Pure's
; on-screen keyboard button: identity, R2 stays R2 (see dos.ini for the units
; without C/Z).
[remap]
l3 = l3
r2 = r2

[options]
dpad_to_analog = 0
