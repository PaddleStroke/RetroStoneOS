; RetroStoneOS input remap: MS-DOS (dosbox_pure), units WITHOUT the optional
; C/Z buttons. Installed as /usr/share/rsos/remaps/dos.ini; user overrides:
; /data/rsos/remaps/dos.ini or dos/<game>.ini. Format: see megadrive.ini.
;
; DOSBox Pure opens its on-screen keyboard with RetroPad L3 (core option
; dosbox_pure_on_screen_keyboard: "L3 only"), and L3 is the optional C button
; that almost no RetroStone2 has (docs/cores.md "Computer cores and input").
; R2 sends L3 here: R2 opens and closes the keyboard (and brings up DOSBox
; Pure's start menu where the core does so on L3). Its joystick presets do not
; use R2; the generic keyboard preset maps R2 to the "4" key, which the
; on-screen keyboard also has.
;
; Select+R2 stays the fast-forward hotkey (hotkeys read the physical buttons,
; before this remap).
[remap]
r2 = l3

[options]
dpad_to_analog = 0
