; RetroStoneOS input remap: Mega Drive / Genesis (picodrive) on units WITH
; the optional C/Z front buttons (Settings > Controls > "Extra C/Z buttons
; fitted", settings.ini cz_buttons=1). Format: see megadrive.ini.
;
; Physical face (docs/input-design.md §1b):
;   top row:    Y (K3)   X (K1)   C (PH3, reports l3)
;   bottom row: Z (PH13, reports r3)   B (K4)   A (K2)
; The bottom row becomes MD A/B/C and the top row MD X/Y/Z. With picodrive's
; RetroPad layout (Y=A, B=B, A=C, L=X, X=Y, R=Z) that is:
[remap]
r3 = y    ; PH13, bottom left  -> MD A
b = b     ; K4, bottom middle  -> MD B
a = a     ; K2, bottom right   -> MD C
y = l     ; K3, top left       -> MD X
x = x     ; K1, top middle     -> MD Y
l3 = r    ; PH3, top right     -> MD Z
l = l     ; L1 stays MD X
r = r     ; R1 stays MD Z
select = select
start = start

[options]
dpad_to_analog = 0
