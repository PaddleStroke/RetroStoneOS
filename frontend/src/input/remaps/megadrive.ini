; RetroStoneOS input remap: Mega Drive / Genesis (picodrive), units WITHOUT
; the optional C/Z buttons. Installed as /usr/share/rsos/remaps/megadrive.ini;
; user overrides: /data/rsos/remaps/megadrive.ini or megadrive/<game>.ini.
;
; Format (docs/ui-design.md, "Remap files"): in [remap], each line is
;     <physical RetroPad position> = <RetroPad id sent to the core>
; with the names b y select start up down left right a x l r l2 r2 l3 r3
; (l1/r1 are accepted for l/r) or "none". Unlisted buttons are unchanged.
; [options] dpad_to_analog = 1 makes the d-pad drive the left stick on ports
; that have no analog stick (N64).
;
; picodrive reads the MD pad as RetroPad Y=A, B=B, A=C, L=X, X=Y, R=Z and
; Select=Mode (6-button pad option on). The default is identity: the left,
; bottom and right face buttons are MD A/B/C, and L1/top/R1 are MD X/Y/Z.
[remap]
b = b
y = y
a = a
x = x
l = l
r = r
select = select
start = start

[options]
dpad_to_analog = 0
